[project]
name = "asciart"
version = "0.1.0"
description = "Convert images to stunning ASCII art"
requires-python = ">=3.11"
dependencies = [
    "pillow>=10.0",
    "numpy>=1.24",
    "typer>=0.9",
    "textual>=0.80",
    "rich>=13.0",
    "scipy>=1.11",
    "textual-slider>=0.2.0",
]

[project.optional-dependencies]
video = ["opencv-python>=4.8"]
gpu = ["cupy-cuda12x>=13.0"]
jit = ["numba>=0.59"]
all = ["cupy-cuda12x>=13.0", "numba>=0.59", "opencv-python>=4.8"]

[project.scripts]
asciart = "asciart.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
